services:
  postgres:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: keycloak-server
    # 'build' then 'start-dev' ensures the SPI is registered properly
    command: >
      start-dev 
      --http-enabled=true 
      --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_LOG_LEVEL: info
    ports:
      - "8080:8080"
    volumes:
      # EXACT mapping to the file shown in your target folder
      - ./target/keycloak-x509-header-authenticator-1.0.0.jar:/opt/keycloak/providers/keycloak-spi.jar
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: